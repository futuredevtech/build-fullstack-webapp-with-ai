<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e04"/>
      <stop offset="50%" stop-color="#2a1205"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="orangeFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glowFb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#fbBg)"/>
  <circle cx="400" cy="210" r="150" fill="#f59e0b" opacity="0.12" filter="url(#glowFb)"/>

  <!-- Firebase Flame & Cloud database concept -->
  <g transform="translate(320, 80)">
    <!-- Left Wing -->
    <path d="M 12 195 L 82 25 A 8 8 0 0 1 97 29 L 138 108 L 22 190 Z" fill="url(#amberFlame)"/>
    <!-- Right Wing -->
    <path d="M 160 195 L 105 75 A 7 7 0 0 0 92 75 L 75 105 L 152 195 Z" fill="url(#orangeFlame)"/>
    <!-- Bottom Base -->
    <path d="M 15 198 L 78 238 A 12 12 0 0 0 90 238 L 158 198 L 115 170 L 84 195 L 48 170 Z" fill="#b45309"/>
  </g>

  <!-- Database & Auth nodes -->
  <g transform="translate(250, 320)">
    <!-- Database Node -->
    <g transform="translate(0, 0)">
      <rect width="130" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="65" y="25" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">⚡ Firestore</text>
    </g>
    <!-- Auth Node -->
    <g transform="translate(170, 0)">
      <rect width="130" height="40" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
      <text x="65" y="25" fill="#fdba74" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">🔒 Auth &amp; Rules</text>
    </g>
  </g>
</svg>
