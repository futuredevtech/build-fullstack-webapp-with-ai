<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glowing Accent Orbs -->
  <circle cx="620" cy="140" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="200" cy="320" r="100" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Code Editor Window -->
  <g transform="translate(180, 85)">
    <!-- Window Outer -->
    <rect width="440" height="280" rx="14" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="440" height="38" rx="14" fill="#131c2e" />
    <rect y="24" width="440" height="14" fill="#131c2e" />
    <line x1="0" y1="38" x2="440" y2="38" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="22" cy="19" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="19" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="58" cy="19" r="6" fill="#10b981" opacity="0.8"/>
    <text x="220" y="24" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">app.tsx</text>

    <!-- Code Lines / Blocks -->
    <rect x="25" y="60" width="80" height="10" rx="3" fill="#818cf8"/>
    <rect x="115" y="60" width="120" height="10" rx="3" fill="#38bdf8"/>
    
    <rect x="45" y="85" width="140" height="10" rx="3" fill="#64748b"/>
    <rect x="195" y="85" width="60" height="10" rx="3" fill="#34d399"/>
    
    <rect x="65" y="110" width="90" height="10" rx="3" fill="#f43f5e"/>
    <rect x="165" y="110" width="150" height="10" rx="3" fill="#94a3b8"/>

    <rect x="45" y="135" width="190" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="65" y="160" width="110" height="10" rx="3" fill="#38bdf8"/>
    <rect x="185" y="160" width="70" height="10" rx="3" fill="#fbbf24"/>

    <rect x="45" y="185" width="80" height="10" rx="3" fill="#a78bfa"/>
    <rect x="25" y="210" width="40" height="10" rx="3" fill="#818cf8"/>

    <!-- Cursor -->
    <rect x="75" y="210" width="8" height="12" rx="1" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <!-- Floating Badge -->
    <g transform="translate(280, 190)">
      <rect width="135" height="48" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="20" y="30" fill="#a5b4fc" font-family="system-ui" font-size="14" font-weight="bold">&lt;/&gt; Web Dev</text>
    </g>
  </g>
</svg>
