<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="learnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glowLearn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#learnBg)"/>
  <circle cx="400" cy="210" r="150" fill="#10b981" opacity="0.1" filter="url(#glowLearn)"/>

  <!-- Graduation Cap & Open Book -->
  <g transform="translate(400, 190)">
    <!-- Book Spine & Pages -->
    <path d="M 0 60 Q 60 40 140 50 L 140 110 Q 60 100 0 120 Q -60 100 -140 110 L -140 50 Q -60 40 0 60 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M 0 60 Q 60 40 135 48 L 135 52 Q 60 44 0 64 Q -60 44 -135 52 L -135 48 Q -60 40 0 60 Z" fill="#34d399"/>

    <!-- Graduation Cap Top -->
    <path d="M 0 -70 L 130 -25 L 0 20 L -130 -25 Z" fill="#047857" stroke="#6ee7b7" stroke-width="2.5" filter="url(#glowLearn)"/>
    <!-- Cap Skull -->
    <path d="M -70 -4 C -70 35 70 35 70 -4 Z" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <!-- Tassel -->
    <path d="M 0 -25 L 110 5 L 115 50" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="115" cy="55" r="5" fill="#f59e0b"/>
    <circle cx="0" cy="-25" r="4" fill="#fbbf24"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(310, 365)">
    <rect width="180" height="40" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="25" fill="#a7f3d0" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">Foundations &amp; Skills</text>
  </g>
</svg>
